name: Build plugin JAR

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Paper API 26.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CreeperAsk-${{ github.sha }}
          path: target/CreeperAsk-1.0.0-mc26.1.jar
          if-no-files-found: error
          retention-days: 30
